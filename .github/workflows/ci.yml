name: MEIS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # 1. FRONTEND BUILD & LINT (Vite / React)
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend # Change this if your folder name is different

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite App
        run: npm run build

  # ==========================================
  # 2. BACKEND TEST & LINT (FastAPI / Python)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend # Change this if your folder name is different

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Test / Validate App Init
        env:
          # Dummy environment variables so Pydantic-settings doesn't crash on boot
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          # Verify Python can import the app and check for syntax/import issues
          python -c "import fastapi; print('FastAPI loaded successfully')"